MetaData:
  Team: QA
  System: x131-diagnose-system
Storages:
  - FileSystem: { Path: ./session-data }
DataSources:
  - Name: DummyDS
    Generator: FromFileSystem
    GeneratorConfiguration: { DataArrangeOrder: AsciiAsc, FileSystem: { Path: TestData } }
Sessions:
  - Name: Session1
    Transactions:
      - Name: Trans1
        TimeoutMs: 5000
        Http: { BaseAddress: http://127.0.0.1, Port: 8261, Route: status, Method: Get }
        DataSourceNames: [DummyDS]
Assertions:
  - Name: AssertStatus
    Assertion: HttpStatus
    SessionNames: [Session1]
    AssertionConfiguration: { StatusCode: 200, OutputNames: [TxOut] }
  - Name: AssertCount
    Assertion: HermeticByExpectedOutputCount
    SessionNames: [Session1]
    AssertionConfiguration: { OutputNames: [TxOutX], ExpectedOutputCount: 1 }

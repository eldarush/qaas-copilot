# hello.mocker.yaml — container-internal port 8080 (map with -p <host>:8080)
Servers:
  - Http:
      Port: 8080
      Endpoints:
        - Path: /hello
          Actions:
            - Name: HelloOk
              Method: Get
              TransactionStubName: HelloStub

Stubs:
  - Name: HelloStub
    Processor: StaticResponseProcessor
    ProcessorConfiguration:
      Body: hello
      StatusCode: 200
      ContentType: text/plain; charset=utf-8

MetaData:
  Team: Payments
  System: PSP-Status

Storages:
  - FileSystem:
      Path: ./session-data

DataSources:
  - Name: StatusRequests
    Generator: FromFileSystem
    GeneratorConfiguration:
      DataArrangeOrder: AsciiAsc
      FileSystem:
        Path: TestData

Sessions:
  - Name: PaymentStatusSession
    Transactions:
      - Name: CallPaymentStatus
        TimeoutMs: 10000
        DataSourceNames:
          - StatusRequests
        Http:
          BaseAddress: http://127.0.0.1
          Port: 8090
          Route: payments/status
          Method: Get
    Assertions:
      - Assertion: HttpStatus
        Name: StatusIs200
        AssertionConfiguration:
          StatusCode: 200
          OutputNames:
            - CallPaymentStatus
      - Assertion: HermeticByExpectedOutputCount
        Name: ExactlyOneResponse
        AssertionConfiguration:
          OutputNames:
            - CallPaymentStatus
          ExpectedCount: 1
